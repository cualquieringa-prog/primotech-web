<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubicación Primotech</title>
<style>
  :root{
    --bg:#ffffff; --fg:#111111; --muted:#666666; --accent:#2563eb;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111111; --fg:#f5f5f5; --muted:#aaaaaa; --accent:#60a5fa;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111111; --fg:#f5f5f5; --muted:#aaaaaa; --accent:#60a5fa;
  }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .wrap{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; text-align:center; padding:24px; box-sizing:border-box;
  }
  h1{ font-size:1.25rem; margin-bottom:8px; }
  p{ color:var(--muted); margin:6px 0; }
  a.btn{
    display:inline-block; margin-top:20px; padding:12px 24px;
    background:var(--accent); color:#fff; text-decoration:none;
    border-radius:8px; font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Abriendo el mapa…</h1>
  <p>Ituzaingó 444, Córdoba Capital, Argentina</p>
  <p id="manual" style="display:none;">
    Si no se abrió automáticamente, tocá el botón:
  </p>
  <a class="btn" id="manualLink" style="display:none;">Abrir en el mapa</a>
</div>
<script>
  var lat = -31.42210489102592;
  var lon = -64.1836976626465;
  var nombreLugar = encodeURIComponent("Primotech");

  var ua = navigator.userAgent || navigator.vendor || window.opera;
  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

  var appleMapsUrl = "https://maps.apple.com/?ll=" + lat + "," + lon + "&q=" + nombreLugar;
  var googleMapsUrl = "https://www.google.com/maps/search/?api=1&query=" + lat + "," + lon;

  var target = isIOS ? appleMapsUrl : googleMapsUrl;

  document.getElementById("manualLink").href = target;

  setTimeout(function(){
    document.getElementById("manual").style.display = "block";
    document.getElementById("manualLink").style.display = "inline-block";
  }, 1500);

  window.location.href = target;
</script>
</body>
</html>
